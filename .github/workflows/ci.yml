name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Install ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libpcap-dev
      - run: cmake --preset debug
      - run: cmake --build --preset debug
      - run: ctest --preset debug
      - run: cmake --preset tsan
      - run: cmake --build --preset tsan
      - run: ctest --preset tsan

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang-format
      - run: clang-format --dry-run --Werror $(find src tests -name '*.cpp' -o -name '*.hpp')

  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build clang-tidy libpcap-dev
      - run: cmake --preset tidy
      - run: cmake --build --preset tidy

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libpcap-dev
      - run: cmake --preset fuzz
      - run: cmake --build --preset fuzz --target fuzz_decode
      - run: ./build/fuzz/fuzz_decode -max_total_time=120 -print_final_stats=1
